services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis -d aegis']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25-alpine
    ports: ['8123:8123', '9000:9000']
    volumes: ['clickhouse_data:/var/lib/clickhouse']
    profiles: ['analytics']

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: aegis-development
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ['9001:9001', '9002:9000']
    volumes: ['minio_data:/data']
    profiles: ['storage']

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  minio_data:
